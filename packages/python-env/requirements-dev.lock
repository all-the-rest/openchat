# Native half of the document toolchain for `pnpm run setup:python`.
#
# The production image gets these from Alpine packages (apk-packages.txt) so
# every compiled library exists exactly once on the musl filesystem. A
# workstation has no apk, so it installs the same distribution versions from
# PyPI wheels. Keep the versions in this file equal to apk-packages.txt; the
# lock test enforces it, so development and production run the same code.
#
# Installed with `--no-deps`, together with requirements.lock. pypdfium2 is
# absent for the reason documented in requirements.lock.
