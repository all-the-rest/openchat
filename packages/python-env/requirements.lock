# Pip-installed half of the document toolchain, as installed in the
# production image. Alpine 3.24.4 / Python 3.14.10, resolved once with
# `pip install --only-binary :all:`. Every distribution is pinned with `==`;
# there are no extras, markers, URLs or pre-releases. The image installs it
# offline:
#   python3 -m pip install --no-deps --no-index --find-links /wheels \
#       -r /wheels/requirements.lock
#
# The native half (requirements-dev.lock on a workstation, apk-packages.txt in
# the image) supplies onnxruntime, numpy, pandas, lxml, openpyxl, cryptography
# and pillow. pypdfium2 is deliberately absent: pdfplumber only imports it for
# the optional page-renderer, which read_document never uses; the image smoke
# test converts a real PDF on a network-less build step.
