# OpenChat deployment stack (issue #20, milestone M7).
#
# One stack, one compose project. The edge (TLS + optional Basic auth) is the
# owner's reverse proxy; it is not part of this file and joins the `edge`
# network. Nothing here is published beyond host loopback.
#
# Rules this file implements (docs/architecture/03-auth-deployment.md):
#   - OpenCode has no published port and no route from the edge.
#   - The BFF is the only browser-facing application port.
#   - The artifact origin is a second, cookie-less origin with no route to
#     OpenCode, the workspace or the internet.
#   - Every secret comes from the host-only `.env` beside this file; compose
#     interpolation fails loudly when one is missing. No value is committed.
#
# `docker compose --profile opencode up -d` starts a local OpenCode service.
# Leave the profile off when OPENCODE_URL points at an existing service (a
# remote host, a tunnel, or a service outside this stack).
#
# Runbook, cutover order and the limits compose cannot enforce:
# docs/implementation/14-deployment.md.

name: openchat

services:
  bff:
    build:
      context: .
      dockerfile: deploy/Dockerfile.bff
    image: openchat-bff:${OPENCHAT_TAG:-local}
    restart: unless-stopped
    # The bundle writes nothing outside the artifact volume; a writable root
    # filesystem would only be a place to drop a payload.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    pids_limit: 256
    ports:
      # Loopback only: the edge proxy is the public listener. `BFF_PORT` exists
      # so a second stack (a candidate next to a running one) can bind 8788 for
      # its validation window instead of fighting for 8787.
      - "127.0.0.1:${BFF_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      # Off by default: the port is published on host loopback, where any local
      # process can send its own X-Forwarded-For and rotate its throttle bucket.
      # The edge-proxy deployment sets TRUST_PROXY=1 in .env instead.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      AUTH_MODE: ${AUTH_MODE:-session}
      OPENCHAT_USER: ${OPENCHAT_USER:-owner}
      # One credential in exactly one shape: a plaintext password, or a bcrypt
      # digest carried over from a predecessor. Both set, or neither, fails the
      # boot, so an unfilled .env never starts.
      OPENCHAT_PASSWORD: ${OPENCHAT_PASSWORD:-}
      OPENCHAT_PASSWORD_HASH: ${OPENCHAT_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:?set 32+ random bytes in .env}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-0}
      BACKEND_MODE: live
      OPENCODE_URL: ${OPENCODE_URL:-http://opencode:4096}
      OPENCODE_USERNAME: ${OPENCODE_USERNAME:-opencode}
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:?set the OpenCode Basic password in .env}
      WORKSPACE_DIR: /workspace
      ARTIFACTS_DIR: /artifacts
      ARTIFACT_HOST_URL: ${ARTIFACT_HOST_URL:?set https://artifacts.example.com in .env}
      ARTIFACT_SIGNING_KEY: ${ARTIFACT_SIGNING_KEY:?set 32+ random bytes in .env}
      # Shared with the artifact tool inside the OpenCode container; without it
      # the BFF generates an ephemeral token the tool can never match.
      ARTIFACT_INTERNAL_TOKEN: ${ARTIFACT_INTERNAL_TOKEN:?set 32+ random characters in .env}
      CODE_HOST_ORIGIN: ${CODE_HOST_ORIGIN:-https://code.example.com}
      CODE_TICKET_SECRET: ${CODE_TICKET_SECRET:?set 32+ random bytes in .env}
      CODE_TICKET_TTL_SECONDS: ${CODE_TICKET_TTL_SECONDS:-60}
      STT_URL: ${STT_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      DICTATION_MAX_SECONDS: ${DICTATION_MAX_SECONDS:-120}
      DICTATION_MAX_BYTES: ${DICTATION_MAX_BYTES:-26214400}
      WEB_DIST_DIR: /app/web
    volumes:
      # Read-write: the BFF is the only writer of artifact documents.
      - artifacts:/artifacts
      # The workspace belongs to OpenCode; the BFF only reads it.
      - workspace:/workspace:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      artifact-host:
        condition: service_healthy
    networks:
      - edge
      - backend
      - artifacts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  code-host:
    build:
      context: .
      dockerfile: deploy/Dockerfile.code-host
    image: openchat-code-host:${OPENCHAT_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 192
    # No published port. The edge proxy reaches `code-host:8090` on the `edge`
    # network; the browser only ever talks to https://code.example.com.
    expose:
      - "8090"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8090"
      TRUST_PROXY: ${TRUST_PROXY:-0}
      OPENCODE_URL: ${OPENCODE_URL:-http://opencode:4096}
      OPENCODE_USERNAME: ${OPENCODE_USERNAME:-opencode}
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:?set the OpenCode Basic password in .env}
      CODE_HOST_ORIGIN: ${CODE_HOST_ORIGIN:-https://code.example.com}
      APP_ORIGIN: ${APP_ORIGIN:?set https://chat.example.com in .env}
      CODE_TICKET_SECRET: ${CODE_TICKET_SECRET:?set 32+ random bytes in .env}
      CODE_TICKET_TTL_SECONDS: ${CODE_TICKET_TTL_SECONDS:-60}
      CODE_SESSION_TTL_SECONDS: ${CODE_SESSION_TTL_SECONDS:-43200}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-0}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/__sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - edge
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  artifact-host:
    build:
      context: .
      dockerfile: deploy/Dockerfile.artifact-host
    image: openchat-artifact-host:${OPENCHAT_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 128
    ports:
      # The second public origin, and the only other published port. It is
      # public because a cross-origin iframe cannot send credentials: the
      # document is authorized by the signed URL alone (`?exp&sig`), the origin
      # sets no cookie, answers no CORS preflight and has its own CSP. It sits
      # on loopback so the edge proxy, not the internet, is the TLS terminus.
      - "127.0.0.1:${ARTIFACT_PORT:-4100}:4100"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4100"
      ARTIFACTS_DIR: /artifacts
      ARTIFACT_SIGNING_KEY: ${ARTIFACT_SIGNING_KEY:?set 32+ random bytes in .env}
      ARTIFACT_FRAME_ANCESTORS: ${APP_ORIGIN:?set https://chat.example.com in .env}
    volumes:
      # Read-only: the host never writes, and a signed document must not be
      # replaceable from the sandbox origin.
      - artifacts:/artifacts:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # `edge` exists for the proxy only; `artifacts` is internal and shared with
    # the BFF. No membership in `backend`, so there is no path to OpenCode.
    networks:
      - edge
      - artifacts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional local OpenCode service. Off by default: OPENCODE_URL usually points
  # at an existing service (remote host or tunnel, docs/implementation/04).
  # The default is the official versioned image. `opencode:latest` is the stale
  # 1.x line — never use it — and the tag must match the `@opencode/client`
  # range the app pins. The remote overlay swaps in the derived image
  # (`openchat-opencode`, deploy/Dockerfile.opencode) that also carries git,
  # ripgrep, the Docker CLI and the artifact MCP tool.
  opencode:
    profiles:
      - opencode
    image: ${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:2.3.2}
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 2.0
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    # The official image's entrypoint is `opencode`; the command is its argv.
    command:
      - serve
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"
    working_dir: /workspace
    environment:
      # Forwarded by the BFF and the Code host as Basic, but OpenCode 2.3.2
      # ignores it: the upstream 2.x server has no HTTP auth. The API is
      # protected by network isolation (`backend`, never published); the value
      # stays so a future version that restores auth works unchanged (#38).
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:?set the OpenCode Basic password in .env}
      # The artifact MCP tool runs inside this container and writes through the
      # BFF's `/internal/artifacts` route with the shared bearer token.
      OPENCHAT_BFF_URL: ${OPENCHAT_BFF_URL:-http://bff:8787}
      ARTIFACT_INTERNAL_TOKEN: ${ARTIFACT_INTERNAL_TOKEN:?set 32+ random characters in .env}
    volumes:
      # Small state (sessions, config; expect well under 1 GiB); the workspace is
      # the large one and is mounted from the host's disk image in the remote
      # overlay. The official image runs as root with `HOME=/root`.
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode
      - workspace:/workspace
    # No `ports`: reachable only from the BFF and the Code host on `backend`.
    healthcheck:
      # Proves the binary is alive, not that the HTTP API answers. The API probe
      # is `/api/info` through the BFF, which tolerates a dead host
      # (docs/implementation/10-host-status.md).
      test:
        - CMD-SHELL
        - "opencode --version >/dev/null 2>&1"
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Agent tool runtime (profile `tools`). Shares the workspace with OpenCode and
  # talks to the rootless dind sidecar below. Not started by default: it is an
  # operator tool for debugging and for workflows that need a shell with git,
  # gh, ripgrep, node/pnpm and the Docker CLI.
  toolbox:
    profiles:
      - tools
    build:
      context: .
      dockerfile: deploy/code-host/tools.Dockerfile
    image: openchat-tools:${OPENCHAT_TAG:-local}
    restart: "no"
    # tini is the image entrypoint; a second init would nest signal handling.
    init: false
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 512
    environment:
      DOCKER_HOST: ${TOOLBOX_DOCKER_HOST:-tcp://dind:2375}
      HOME: /home/node
    volumes:
      - workspace:/workspace
    healthcheck:
      test:
        - CMD
        - git
        - --version
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend
      - dind
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Rootless Docker daemon for the tool runtime (profile `dind`). Never started
  # with the application stack. The daemon runs as an unprivileged user inside
  # its own container and listens on the private `dind` network only.
  dind:
    profiles:
      - dind
    image: ${DIND_IMAGE:-docker:27-dind-rootless@sha256:e2ac8e8f66ae21a060b0a8e3005c70f6ed9441aabf409434463d1f6eecd38026}
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 2.0
    pids_limit: 1024
    environment:
      # No TLS: the listener is on an internal network with no edge member and
      # no published port. Enabling TLS here would need a certificate volume for
      # a client that is a single container on the same network.
      DOCKER_TLS_CERTDIR: ""
    command:
      - "--host=tcp://0.0.0.0:2375"
    security_opt:
      # Rootless mode needs user namespaces; the default seccomp and AppArmor
      # profiles block the mount and namespace syscalls it needs. This is the
      # one container with a relaxed profile, and it is still not privileged.
      - seccomp=unconfined
      - apparmor=unconfined
    tmpfs:
      - /run/user/1000:size=32m,mode=0700
    volumes:
      - dind-storage:/home/rootless/.local/share/docker
    healthcheck:
      test:
        - CMD-SHELL
        - "docker info >/dev/null 2>&1"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - dind
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # The TLS proxy's network. It carries no default route requirement of its own;
  # the proxy may also be attached to other stacks.
  edge:
  # BFF <-> Code host <-> OpenCode. Not internal: OpenCode needs egress to model
  # providers. Never published.
  backend:
  # Artifact origin <-> BFF. `internal: true` removes the default route, so the
  # artifact container cannot reach the internet or `backend`.
  artifacts:
    internal: true
  # Toolbox <-> rootless daemon. No egress and no edge member.
  dind:
    internal: true

volumes:
  # Written by the BFF only, mounted read-only into the artifact host.
  artifacts:
  # Owned by OpenCode; read-only in the BFF, read-write in the toolbox.
  workspace:
  opencode-data:
  opencode-config:
  dind-storage:
