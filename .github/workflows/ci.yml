name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    name: e2e
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openchat/web exec playwright install --with-deps chromium
      # The Playwright config starts the fake BFF (8787) and Vite (5173).
      - run: pnpm run test:e2e
      # UI-review captures: dark/German/drawer/expanded states at the four
      # breakpoints. Same fake backend, no provider. `always()` keeps these
      # running after a red E2E step; the upload below is `always()` too, so a
      # failed run leaves the screenshots that explain it.
      - run: pnpm --filter @openchat/web run test:screenshots
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review-screenshots
          path: apps/web/ui-review/
          retention-days: 7

  ratchet:
    name: ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The i18n counter runs a TypeScript script with Node's native type
      # stripping, so the job pins the same Node major as the other jobs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: all-the-rest/ratchet-cli@dcb6a489d13aa9c7513584caf739deb7d97dcaee # v0.8.0
        with:
          mode: validate
          version: v0.8.0
          tier: fast
          args: --no-ratchet
