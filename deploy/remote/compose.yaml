# Remote overlay for the owner's VPS (issue #20, docs/implementation/20-remote-deploy.md).
#
# Apply it on top of the committed stack, never instead of it:
#
#   docker compose -f compose.yaml -f deploy/remote/compose.yaml config
#
# It changes three things and nothing else:
#
#   1. `edge` is the host's existing external `webnet` network. The host Caddy
#      container (not this stack) terminates TLS and is the only public
#      listener; nothing here publishes to the internet.
#   2. Every image comes from the local build of this source tree. There is no
#      registry in the loop yet (GHCR is an owner step), so the tag is the short
#      commit sha the deploy script exports as OPENCHAT_TAG.
#   3. Storage is bounded. Memory gets a per-service limit that fits beside the
#      predecessor stack, and the four large directories are mounted from ext4
#      images the deploy script creates, mounts and size-caps (artifacts 2 GiB,
#      workspace 4 GiB, dind 4 GiB, memory 1 GiB). Without `--with-dind` the
#      dind image is mounted but unused.
#
# The loopback `ports:` entries from the base file stay: they are the
# validation path `deploy/swap.sh` probes, and 127.0.0.1 is not reachable from
# outside the host.
#
# Profiles are untouched. The deploy script exports COMPOSE_PROFILES=opencode
# (plus `,tools,dind` with --with-dind), which is what makes `opencode` start
# with the application services.
#
# The overlay is additive: a service that exists only in the base file keeps the
# base defaults in production. Anything added to compose.yaml needs an entry
# here for its memory cap and its disk binds; `remote-compose-merge.test.ts`
# fails on the merged config when it does not.
#
# The BFF's memory store is a sixth bind from its own disk image, so the
# `/workspace/.memory` mount is host-backed and size-capped like `/artifacts`.

name: openchat

services:
  # Gate for the loopback disks. `mount-disks.sh` writes `.openchat-disk` into
  # each mounted image; an unmounted bind directory is empty and fails here.
  # Without this, a failed mount would let Docker start the stack on the root
  # filesystem, silently without the size caps and with an empty workspace.
  # `alpine:3` is the smallest stock image; the check is four `test -f`s. The
  # tag is pinned by index digest (multi-arch) so the start path cannot fetch a
  # different image than the one that was reviewed. Bump command:
  #   docker buildx imagetools inspect alpine:3
  # then update the digest here and `ALPINE_INDEX_DIGEST` in the limits test.
  disks-ready:
    image: alpine:3@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    # A one-shot `test -f`; the cap is here only so the merged config has one
    # memory limit per service and nothing can be added without one.
    mem_limit: 64m
    mem_reservation: 16m
    command:
      - sh
      - -c
      - >-
        test -f /disks/artifacts/.openchat-disk &&
        test -f /disks/workspace/.openchat-disk &&
        test -f /disks/dind/.openchat-disk &&
        test -f /disks/memory/.openchat-disk
    restart: "no"
    volumes:
      - /opt/stacks/openchat/disks/artifacts:/disks/artifacts:ro
      - /opt/stacks/openchat/disks/workspace:/disks/workspace:ro
      - /opt/stacks/openchat/disks/dind:/disks/dind:ro
      - /opt/stacks/openchat/disks/memory:/disks/memory:ro

  bff:
    image: openchat-bff:${OPENCHAT_TAG:-local}
    # The BFF is the availability-critical process: it owns the login, the SSE
    # stream and every /api route. It keeps its share while OpenCode is capped.
    mem_limit: 512m
    # Reservation is `memory.low`; the measured working set (#44) was ~16 MiB.
    mem_reservation: 32m
    depends_on:
      disks-ready:
        condition: service_completed_successfully
    environment:
      # The in-stack service always wins; a stale OPENCODE_URL in .env cannot
      # point the BFF at the predecessor's instance by accident.
      OPENCODE_URL: http://opencode:4096
      # The soft cap is a deployment knob, not a build constant: 0 turns the
      # BFF-side compaction off for hosts that only want the host policy.
      CHAT_CONTEXT_SOFT_CAP: ${CHAT_CONTEXT_SOFT_CAP:-200000}
    networks:
      # The alias is the DNS name the host Caddyfile uses (`openchat-bff:8787`);
      # the Compose service name alone would resolve as `bff`.
      edge:
        aliases:
          - openchat-bff
      backend: {}
      artifacts: {}
    volumes:
      # Bind mounts replace the named volumes by target path. A loopback ext4
      # image is the only hard size cap Docker cannot express on XFS/noquota
      # with the containerd snapshotter (`storage_opt` is unavailable there).
      - /opt/stacks/openchat/disks/artifacts:/artifacts
      - /opt/stacks/openchat/disks/workspace:/workspace:ro
      # The one subtree the BFF writes (issue #25). A nested bind keeps the
      # rest of the agent's workspace read-only; mount-disks.sh creates the
      # directory and gives it the service uid before the container starts.
      - /opt/stacks/openchat/disks/workspace/chats:/workspace/chats
      # Agent memory (issue #49): a bind from its own disk image, replacing the
      # base `memory-data` volume. The BFF is the only writer; OpenCode has no
      # memory mount and reaches the store through the BFF's internal route.
      - /opt/stacks/openchat/disks/memory:/workspace/.memory

  code-host:
    image: openchat-code-host:${OPENCHAT_TAG:-local}
    mem_limit: 256m
    # ~70 MiB measured (#44), 2x.
    mem_reservation: 160m
    environment:
      OPENCODE_URL: http://opencode:4096
    networks:
      edge:
        aliases:
          - openchat-code-host
      backend: {}

  artifact-host:
    image: openchat-artifact-host:${OPENCHAT_TAG:-local}
    mem_limit: 128m
    # ~13 MiB measured (#44), 2x.
    mem_reservation: 32m
    depends_on:
      disks-ready:
        condition: service_completed_successfully
    networks:
      edge:
        aliases:
          - openchat-artifact-host
      artifacts: {}
    volumes:
      - /opt/stacks/openchat/disks/artifacts:/artifacts:ro

  documents:
    image: openchat-documents:${OPENCHAT_TAG:-local}
    # LibreOffice is the memory peak: one job at a time, one render plus one
    # conversion per request. The base file's 1500m cap is lowered here to fit
    # beside the predecessor stack; a killed job is retried by the caller.
    mem_limit: 1024m
    # ~180 MiB working set after a conversion; 2x.
    mem_reservation: 384m
    depends_on:
      disks-ready:
        condition: service_completed_successfully
    # No ports, no disks: reached by the agent tool on `backend` only.
    networks:
      backend: {}

  opencode:
    # The derived image: the official 2.3.2 base plus git, ripgrep, the Docker
    # CLI and the artifact tool. Built here, never pulled as `latest` (1.x).
    build:
      context: .
      dockerfile: deploy/Dockerfile.opencode
    image: openchat-opencode:${OPENCHAT_TAG:-local}
    # 1536 MiB, not 1280: the Code surface is the reason this stack exists, and
    # the predecessor's own OpenCode instance is the box's largest tenant today.
    # See the memory budget in the runbook before lowering it.
    mem_limit: 1536m
    # ~84 MiB measured (#44), 2x. `memory.low`, not a RAM reservation.
    mem_reservation: 384m
    depends_on:
      disks-ready:
        condition: service_completed_successfully
    environment:
      # The artifact tool's writes go through the BFF on `backend`.
      OPENCHAT_BFF_URL: http://bff:8787
      # The CLI is in the image because agents build with it. Without the dind
      # profile the socket is simply absent and `docker` reports a connection
      # error instead of reaching the host daemon.
      DOCKER_HOST: ${OPENCODE_DOCKER_HOST:-tcp://dind:2375}
    networks:
      backend: {}
      dind: {}
    volumes:
      - /opt/stacks/openchat/disks/workspace:/workspace
      # The base file gives this target its own volume; on the host it must be
      # the same directory the BFF writes into (issue #25).
      - /opt/stacks/openchat/disks/workspace/chats:/workspace/chats
      # Bind mount, not the named volume: the deploy script seeds the one MCP
      # entry there once, and the agent may keep editing the file afterwards.
      # The official image runs as root with `HOME=/root`.
      - /opt/stacks/openchat/opencode-config:/root/.config/opencode

  toolbox:
    image: openchat-tools:${OPENCHAT_TAG:-local}
    mem_limit: 512m
    mem_reservation: 192m
    depends_on:
      disks-ready:
        condition: service_completed_successfully
    networks:
      backend: {}
      dind: {}
    volumes:
      - /opt/stacks/openchat/disks/workspace:/workspace
      - /opt/stacks/openchat/disks/workspace/chats:/workspace/chats

  dind:
    # Memory, not CPU, is the binding constraint for the rootless daemon: the
    # image layer store and build cache live in RAM until they are written.
    mem_limit: 1024m
    mem_reservation: 512m
    depends_on:
      disks-ready:
        condition: service_completed_successfully
    volumes:
      - /opt/stacks/openchat/disks/dind:/home/rootless/.local/share/docker

networks:
  # The host Caddy container already runs on this network and owns 80/443.
  # `external: true` means Compose never creates or removes it.
  edge:
    external: true
    name: webnet
