# Fully pinned runtime set for the documents service (issue #46).
#
# Resolved on python:3.13-slim (Debian trixie, glibc) with:
#   pip install "markitdown[docx,pptx,xlsx,pdf]==0.1.9" \
#     "docxtpl==0.20.2" "python-docx==1.2.0" "pypdf==7.1.1" "pillow==13.0.0"
# and `pip freeze` on 2026-11-18. Every line is name==version; no pre-release,
# URL, VCS or environment marker is allowed (tests/test_lock.py pins this).
#
# markitdown's `magika` dependency pulls onnxruntime + numpy here. That is the
# reason markitdown lives in this Debian image and not in the Alpine agent image
# (no musllinux wheel for Python 3.14). LibreOffice and the metric-compatible
# fonts come from apt in deploy/Dockerfile.documents, not from this file.
