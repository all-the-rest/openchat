# Fully pinned runtime set for the documents service (issue #46).
#
# Resolved on python:3.13-slim (Debian trixie, glibc) with
#   pip install "docxtpl==0.20.2" "python-docx==1.2.0" "pypdf==7.1.1" "pillow==13.0.0"
# and `pip freeze` on 2026-11-18. Every line is name==version; no pre-release,
# URL, VCS or environment marker is allowed (tests/test_lock.py pins this).
#
# Deliberate omission: markitdown. The agent image ships it locally since
# b01d695, so `read_document` reads DOCX/XLSX/PPTX/PDF/HTML offline. This
# Debian container exists only for what the Alpine image cannot do: LibreOffice
# DOCX->PDF and .dotx content-type rewriting. Adding markitdown here would pull
# magika -> onnxruntime -> numpy/pandas again for a second copy of the same
# code path. One format, one path.
